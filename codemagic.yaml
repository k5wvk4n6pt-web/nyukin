# 入金ナビ：iPhoneアプリを組み立てて App Store Connect（TestFlight）へ送る
# Codemagic の画面で「Start new build」→ ios-release を選ぶと実行される
workflows:
  ios-release:
    name: 入金ナビ iOS
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: nyukin      # Codemagic に登録した App Store Connect APIキーの名前
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.k5wvk4n6pt.nyukinnavi
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 部品のインストール
        script: npm install
      - name: iOSプロジェクトを組み立てる
        script: bash ios-setup.sh
      - name: 署名の設定
        script: xcode-project use-profiles
      - name: ビルド番号
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: アプリ（ipa）を作る
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
