<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action https://docs.google.com; frame-src https://docs.google.com">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="引落ナビ">
<meta name="theme-color" content="#FFE3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="icon" href="icon-192-v3.png">
<title>引落ナビ</title>
<style>
/* Layout: 1カラムの通帳風。上から 要約 → 銀行別 → 変動費 → 固定費 → バックアップ */
:root {
  --bg: #FBF8F4; --surface: #FFFFFF; --ink: #2F3542; --muted: #767C8A; --line: #ECE6EE;
  --accent: #4473C5; --accent-soft: #E8EFFC; --on-accent: #FFFFFF;
  --short: #C8453B; --short-bg: #FDECEA; --ok: #2D7F5B; --ok-bg: #E2F5EB; --warn: #946200; --warn-bg: #FFF3D6; --field: #FFFDFB;
  --c-blue: #4473C5; --c-blue-bg: #E8EFFC;
  --c-lav: #7656C2; --c-lav-bg: #F0EAFB;
  --c-peach: #C25A24; --c-peach-bg: #FEEEE3;
  --c-teal: #22807F; --c-teal-bg: #DFF3F1;
  --c-pink: #BE4A7E; --c-pink-bg: #FCE8F1;
  --c-yellow: #8E6A00; --c-yellow-bg: #FFF5D4;
  --font-display: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-body: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191E; --surface: #20232A; --ink: #ECEAF0; --muted: #A3A7B3; --line: #343842;
    --accent: #8FB2F0; --accent-soft: #24304A; --on-accent: #10192B;
    --short: #FF9C91; --short-bg: #3D2224; --ok: #86D3AE; --ok-bg: #1C3328; --warn: #F0C77A; --warn-bg: #3A2F1A; --field: #1B1E24;
    --c-blue: #8FB2F0; --c-blue-bg: #24304A;
    --c-lav: #BBA6F2; --c-lav-bg: #2E2742;
    --c-peach: #F3A877; --c-peach-bg: #3C2A20;
    --c-teal: #7CD1CB; --c-teal-bg: #1B3634;
    --c-pink: #F0A0C4; --c-pink-bg: #3B2232;
    --c-yellow: #EBCB6E; --c-yellow-bg: #383019;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #17191E; --surface: #20232A; --ink: #ECEAF0; --muted: #A3A7B3; --line: #343842;
    --accent: #8FB2F0; --accent-soft: #24304A; --on-accent: #10192B;
    --short: #FF9C91; --short-bg: #3D2224; --ok: #86D3AE; --ok-bg: #1C3328; --warn: #F0C77A; --warn-bg: #3A2F1A; --field: #1B1E24;
    --c-blue: #8FB2F0; --c-blue-bg: #24304A;
    --c-lav: #BBA6F2; --c-lav-bg: #2E2742;
    --c-peach: #F3A877; --c-peach-bg: #3C2A20;
    --c-teal: #7CD1CB; --c-teal-bg: #1B3634;
    --c-pink: #F0A0C4; --c-pink-bg: #3B2232;
    --c-yellow: #EBCB6E; --c-yellow-bg: #383019;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#main { display: grid; gap: 28px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.num, input.amount { font-variant-numeric: tabular-nums; }
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 22px; }
h2 { font-size: 18px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.sub { color: var(--muted); font-size: 13px; }
.yen { font-size: .72em; margin-left: 1px; color: var(--muted); font-weight: 400; }

/* ヘッダー */
header.top { padding-top: 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.today { text-align: right; }
.today b { font-family: var(--font-display); font-size: 17px; font-weight: 600; display: block; }
.saved { font-size: 12px; color: var(--muted); min-height: 1.2em; }

/* 要約 */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.periods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.period { display: grid; gap: 2px; }
.period .lab { font-size: 13px; font-weight: 600; }
.period .rng { font-size: 12px; color: var(--muted); }
.period .val { font-size: 22px; font-weight: 600; }
.period.after .val, .bank-amts .after .v { color: var(--muted); font-weight: 500; }
.tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
.shortbox { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--short-bg); color: var(--short); }
.shortbox.ok { background: var(--ok-bg); color: var(--ok); }
.shortbox.none { background: var(--accent-soft); color: var(--accent); }
.shortbox .big { font-size: 24px; font-weight: 700; }
.tots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tot { border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tot .tl { font-size: 12px; font-weight: 600; }
.tot .big { font-size: 22px; font-weight: 700; }
.tot small { font-size: 12px; opacity: .85; }
.emptyrow { padding: 14px; border-bottom: 1px solid var(--line); }
.datein { width: auto; flex: 0 1 auto; min-width: 0; }
.cardacts { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cardacts details { flex: 1 1 60%; min-width: 0; }
.xferlog { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.xrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.xsheet label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.xsheet select { width: 100%; }
.xprev { display: grid; gap: 8px; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.okc { color: var(--ok); font-size: 13px; } .ngc { color: var(--short); font-size: 13px; }
.xsheet label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.modal:not([hidden]) ~ .toast { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; }
.cardacts.end { justify-content: flex-end; }
.fabs { position: fixed; z-index: 41; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: none; }
.fab { pointer-events: auto; min-height: 48px; min-width: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 18px; font-weight: 700; box-shadow: 0 4px 14px color-mix(in srgb, var(--ink) 18%, transparent); }
.fab.add { background: var(--accent); color: var(--bg); border-color: var(--accent); font-size: 16px; padding: 10px 18px; }
body.typing .fabs { display: none; }
.row.flash, .bank.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.flash { animation: none; } }
.xsheet .btnrow > * { flex: 1 1 90px; }
.cycle { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.cyc-head { display: flex; align-items: center; gap: 8px; }
.cyc-head button { min-width: 44px; font-size: 20px; font-weight: 700; color: var(--accent); }
.cyc-title { flex: 1; min-width: 0; display: grid; text-align: center; }
.shiftinfo { font-size: 12px; color: var(--warn); }
.cyc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cyc-grid > div { display: grid; gap: 2px; min-width: 0; }
.cyc-grid .k { font-size: 12px; color: var(--muted); }
.cyc-grid .v { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.cyc-grid .diff.pos .v { color: var(--ok); } .cyc-grid .diff.neg .v { color: var(--short); }
.cyc-kinds { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.cyc-kinds b { color: var(--ink); font-weight: 600; }
.bulkbtn { width: 100%; margin-top: 8px; }
.blist { display: grid; gap: 8px; max-height: 46vh; overflow-y: auto; }
.brow { display: flex; gap: 8px; align-items: flex-start; background: var(--bg); border-radius: 10px; padding: 10px; }
.brow .check { flex: 0 0 auto; min-height: 0; }
.brow .grow { min-width: 0; display: grid; gap: 6px; font-size: 14px; }
.allline { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 13px; color: var(--muted); padding: 8px 2px 0; }
.allline b { color: var(--ink); font-weight: 600; }
.afternote { font-size: 13px; color: var(--muted); margin-top: -2px; }
.afternote.neg { color: var(--short); }
.tot.short { background: var(--short-bg); color: var(--short); }
.tot.plus { background: var(--ok-bg); color: var(--ok); }
.tot.zero { background: var(--accent-soft); color: var(--muted); }
.shortbox small { display: block; font-size: 12px; opacity: .85; }
.income { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.income-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.income-row .who { font-weight: 600; min-width: 3em; }
.income-row .when { color: var(--muted); flex: 1; }
.income-row input.amount { width: 128px; }

/* 銀行カード */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.banks { display: grid; gap: 10px; }
.bank { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.bank.is-short { border-color: color-mix(in srgb, var(--short) 45%, var(--line)); box-shadow: inset 4px 0 0 var(--short); }
.bank-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bank-name { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.next { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bank-amts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bank-amts div { display: grid; }
.bank-amts .k { font-size: 12px; color: var(--muted); }
.bank-amts .v { font-size: 17px; font-weight: 600; }
.bank-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bank-foot label { font-size: 13px; color: var(--muted); }
.bank-foot input.amount { flex: 1; min-width: 120px; }
.pill { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pill.short { background: var(--short-bg); color: var(--short); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.none { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.flag { font-size: 12px; color: var(--warn); }
details.lines summary { font-size: 13px; color: var(--accent); cursor: pointer; list-style: none; padding: 4px 0; }
details.lines summary::-webkit-details-marker { display: none; }
details.lines summary::before { content: "＋ "; }
details.lines[open] summary::before { content: "－ "; }
.line-list { display: grid; gap: 2px; font-size: 13px; margin-top: 4px; }
.line-list .wh { font-size: 12px; color: var(--muted); margin-top: 6px; }
.li { display: grid; grid-template-columns: 5.6em 1fr auto; gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
.wkend { color: var(--short); }
.shifted { font-size: 12px; color: var(--muted); margin-left: 4px; }
.irow-bot select { min-width: 0; flex: 1 1 auto; }
.edit select { width: 100%; }
.idle { background: transparent; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--muted); }
.idle b { color: var(--ink); font-weight: 600; }

/* 入力リスト */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.row:last-child { border-bottom: 0; }
.row-main { display: flex; align-items: center; gap: 10px; }
.row-name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.row-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stamp { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.stamp.fresh { color: var(--accent); }
.memo { font-size: 12px; color: var(--muted); }
.ended { opacity: .55; }

/* フォーム部品（16px以上でiPhoneの自動拡大を防ぐ） */
input, select, button { font: inherit; font-size: 16px; color: var(--ink); }
input.amount, input.text { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 44px; }
input.amount { text-align: right; width: 140px; }
input.text { width: 100%; }
input:focus, select:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.amount.empty { border-style: dashed; }
select { appearance: none; -webkit-appearance: none; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 8px; padding: 8px 26px 8px 10px; min-height: 40px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 13px) 52%, calc(100% - 9px) 52%; background-size: 4px 4px; background-repeat: no-repeat; max-width: 100%; }
button { min-height: 44px; border-radius: 10px; padding: 10px 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-left: 8px; padding-right: 8px; }
button.danger { color: var(--short); border-color: color-mix(in srgb, var(--short) 40%, var(--line)); background: transparent; }
button.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.edit { display: grid; gap: 8px; padding: 10px; background: var(--bg); border-radius: 10px; }
.edit label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.edit .btns { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.add { padding: 8px 14px 12px; }

/* 下の移動ボタン */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav button { border: 0; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; min-height: 46px; border-radius: 10px; padding: 6px 4px; }
.nav button.on { background: var(--accent-soft); color: var(--accent); }
body.typing .nav { display: none; }
section[id], #sec-top { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 12px); }

/* 設定 */
.settings .shead { padding: 14px 14px 6px; font-weight: 700; display: grid; gap: 2px; }
.srow { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.srow .text { flex: 1; min-width: 0; }
.srow select { flex: 0 0 auto; }
.srow.is-hidden .text { color: var(--muted); text-decoration: line-through; }
.row-acts { display: flex; gap: 4px; flex-wrap: wrap; }
.hiddenbox { margin-top: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.hiddenbox summary { padding: 12px 14px; color: var(--muted); font-size: 14px; cursor: pointer; }
.hrow { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.hrow .row-name { display: grid; color: var(--muted); font-weight: 600; }
.hrow .row-name .sub { font-weight: 400; }
.head-right { display: flex; align-items: center; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.seg button { border: 0; background: transparent; color: var(--accent); font-weight: 600; min-height: 42px; border-radius: 9px; padding: 6px 4px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent); }
.small-seg { margin-bottom: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card .pad { padding: 14px 14px 10px; display: grid; gap: 4px; }
.card .pad .section-head { margin-bottom: 0; }
.card .pad h2 { font-size: 17px; }
.form { padding: 14px; display: grid; gap: 12px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form .shead { padding: 0; display: grid; gap: 2px; font-weight: 700; }
.shead .sub { font-weight: 400; }
.form select { width: 100%; }
.addform { border-top: 1px solid var(--line); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
input.amount.wide { width: 100%; }
.irow { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.irow-top, .irow-bot { display: flex; align-items: center; gap: 8px; }
.irow-top .text { flex: 1; min-width: 0; }
.irow-top .amount { width: 128px; }
.irow.is-hidden .text { color: var(--muted); text-decoration: line-through; }
.grow { flex: 1; }
.orow { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); }
.list .orow:first-child { border-top: 0; }
.oname { flex: 1; min-width: 0; font-weight: 600; display: grid; overflow-wrap: anywhere; }
.oname small { font-weight: 400; color: var(--muted); font-size: 12px; }
button.mv { min-width: 48px; min-height: 44px; font-size: 18px; font-weight: 700; color: var(--accent); }
button.mv:disabled { opacity: .3; }
.srow.add-row { border-bottom: 0; padding-bottom: 14px; }
.nowrap { white-space: nowrap; min-width: 2.8em; text-align: right; }

/* お知らせ・バックアップ */
.notice { border-radius: 12px; padding: 14px; font-size: 14px; display: grid; gap: 10px; background: var(--warn-bg); color: var(--warn); }
.notice b { color: inherit; }
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow > * { flex: 1 1 140px; }
.fileBtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; cursor: pointer; }
.fileBtn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.fileBtn input { position: absolute; inset: 0; opacity: 0; font-size: 16px; cursor: pointer; }
.note { font-size: 12px; color: var(--muted); }
.welcome { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.welcome ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

/* 確認ダイアログ */
.modal { position: fixed; inset: 0; background: rgba(10, 12, 18, .45); display: grid; place-items: end center; z-index: 50;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

/* ===== 信頼感のある青のデザイン（口座管理アプリ風）===== */
:root {
  --bg: #F3F7FC; --surface: #FFFFFF; --ink: #1B2A44; --muted: #6A778C; --line: #E3EAF3; --field: #FAFCFF;
  --accent: #1F5FC8; --accent-soft: #E7F0FD; --on-accent: #FFFFFF;
  --c-blue: #1F5FC8; --c-blue-bg: #EAF2FE;
  --navy: #14336B; --brown: #14336B; --pink: #F2B705; --gold: #F5BC1C;
  --hero-top: #E3EEFB; --hero-mid: #EFF5FD;
  --nav-on: #DCEAFD; --nav-on-ink: #1F5FC8;
  --card-shadow: 0 1px 2px rgba(20, 51, 107, .06), 0 6px 18px rgba(20, 51, 107, .07);
  --font-display: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --font-body: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1726; --surface: #172235; --ink: #E6ECF5; --muted: #9AA8BD; --line: #263449; --field: #121C2C;
  --accent: #6FA3F5; --accent-soft: #1C2D4A; --on-accent: #0B1630;
  --c-blue: #6FA3F5; --c-blue-bg: #1A2A45;
  --navy: #DCE7F7; --brown: #DCE7F7; --pink: #E9B12A; --gold: #E9B12A;
  --hero-top: #13213A; --hero-mid: #111B2D; --nav-on: #1F3459; --nav-on-ink: #8CB6F7;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); } }
:root[data-theme="dark"] {
  --bg: #0F1726; --surface: #172235; --ink: #E6ECF5; --muted: #9AA8BD; --line: #263449; --field: #121C2C;
  --accent: #6FA3F5; --accent-soft: #1C2D4A; --on-accent: #0B1630;
  --c-blue: #6FA3F5; --c-blue-bg: #1A2A45;
  --navy: #DCE7F7; --brown: #DCE7F7; --pink: #E9B12A; --gold: #E9B12A;
  --hero-top: #13213A; --hero-mid: #111B2D; --nav-on: #1F3459; --nav-on-ink: #8CB6F7;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); }
body { font-family: var(--font-body); background: linear-gradient(180deg, var(--hero-top) 0, var(--hero-mid) 260px, var(--bg) 520px) no-repeat, var(--bg); }
h1, h2 { font-family: var(--font-display); }
h2 { font-weight: 800; letter-spacing: .01em; }
.num { font-feature-settings: "tnum"; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
/* ヘッダー */
.hero { padding-top: 14px; padding-bottom: 0; display: grid; gap: 12px; }
.hero-top { grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px; }
.roundbtn { width: 48px; height: 48px; padding: 0; border-radius: 50%; background: var(--surface); color: var(--navy); box-shadow: var(--card-shadow); }
.roundbtn svg { width: 22px; height: 22px; }
.brand { gap: 8px; }
.brand-ico { width: 40px; height: 37px; flex: 0 0 auto; }
.brand h1 { font-size: clamp(20px, 6.2vw, 28px); font-weight: 800; color: var(--navy); letter-spacing: .04em; padding: 0 0 6px; }
.brand h1::after { left: 0; right: 0; bottom: -2px; height: 4px; background: linear-gradient(90deg, transparent, var(--gold) 12%, var(--gold) 88%, transparent); transform: rotate(-1deg); border-radius: 999px; }
.todaycard { justify-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); box-shadow: var(--card-shadow); color: var(--navy); }
.todaycard .ico { width: 22px; height: 22px; color: var(--navy); }
.todaycard .tc-lab { font-weight: 700; font-size: 15px; }
.todaycard b { font-size: 16px; font-weight: 800; letter-spacing: .02em; }
.hero > .saved { justify-self: center; font-size: 11px; color: var(--muted); margin-top: -6px; min-height: 1em; }
/* カード共通 */
.summary, .cycle, .card, .backup, .guide, .welcome, .incomecard, .totalcard, .upcoming { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--card-shadow); }
.list { border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--card-shadow); }
.bank { border-radius: 16px; box-shadow: var(--card-shadow); }
.notice { border-radius: 18px; box-shadow: none; color: var(--ink); }
input.amount, input.text { border-radius: 12px; }
.acchead { color: var(--navy); font-size: 17px; font-weight: 800; }
.acchead svg { width: 28px; height: 28px; }
.acchead { flex-wrap: wrap; row-gap: 0; }
.acchead .sub { flex-basis: 100%; padding-left: 36px; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: -2px; }
.upcoming .acchead .sub { flex-basis: auto; }
h1, h2, .bank-name, .lab, .k, .tl { color: var(--navy); }
/* 合計残高 */
.totalcard { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 14px; padding: 18px 18px; background: linear-gradient(135deg, var(--surface) 30%, color-mix(in srgb, var(--c-blue-bg) 90%, var(--surface))); }
.totalcard::after { content: ""; position: absolute; right: -30px; bottom: -50px; width: 220px; height: 120px; border-radius: 50%; background: color-mix(in srgb, var(--c-blue) 7%, transparent); pointer-events: none; }
.totalcard .coins { width: 52px; height: 52px; grid-row: span 2; }
.totalcard .tl-body { display: grid; gap: 2px; min-width: 0; position: relative; z-index: 1; }
.totalcard .tl-lab { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 800; color: var(--navy); }
.totalcard .tl-val { font-size: clamp(28px, 9vw, 38px); font-weight: 800; color: var(--navy); letter-spacing: .01em; line-height: 1.15; white-space: nowrap; }
.totalcard .tl-val.masked { letter-spacing: .12em; }
.totalcard .tl-note { font-size: 12px; color: var(--muted); }
.totalcard .eye { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--navy); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 1px 3px rgba(20, 51, 107, .08); white-space: nowrap; }
.totalcard .eye svg { width: 18px; height: 18px; }
/* 口座ごと */
.summary { padding: 16px; gap: 16px; }
.acctable { border: 1px solid var(--line); border-radius: 14px; }
.acrow { grid-template-columns: 32px minmax(0, 1fr) auto auto 14px; padding: 12px 12px; }
.acrow svg { width: 30px; height: 26px; }
.acrow .nm { font-size: 16px; color: var(--ink); }
.acrow .am b { font-size: 16px; color: var(--navy); }
.acrow .am.after b { color: #C2410C; }
.acrow .am.short b { color: var(--short); }
/* 期限のタイル（今後の予定） */
.periods { gap: 10px; }
.period { border-radius: 16px; border: 1px solid color-mix(in srgb, var(--c-blue) 25%, transparent); background: var(--c-blue-bg); box-shadow: none; padding: 12px 14px; }
.period .lab { color: var(--navy); font-size: 14px; }
.period .val { color: var(--c-blue); font-weight: 800; }
.period.after { border-color: color-mix(in srgb, var(--short) 25%, transparent); background: var(--short-bg); box-shadow: none; }
.period.after .val { color: var(--short); font-weight: 800; }
.period.after .lab, .period.after .tag { color: var(--navy); }
.period .rng { color: var(--muted); }
/* これからの入出金 */
.upcoming { padding: 16px; display: grid; gap: 4px; }
.upcoming .acchead { justify-content: space-between; margin-bottom: 4px; }
.upcoming .acchead > span { display: flex; align-items: center; gap: 8px; }
.upcoming .more { min-height: 32px; padding: 4px 6px; border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 700; }
.uprow { display: grid; grid-template-columns: 26px auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 10px 2px; border-top: 1px solid var(--line); font-size: 15px; }
.uprow .ar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.uprow .ar svg { width: 14px; height: 14px; }
.uprow.in .ar { background: var(--ok); } .uprow.out .ar { background: var(--short); }
.uprow .kd { font-weight: 700; color: var(--ink); font-size: 14px; }
.uprow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.uprow .dt { color: var(--muted); font-size: 13px; }
.uprow .am { font-weight: 800; text-align: right; min-width: 6.5em; }
.uprow.in .am { color: var(--ok); } .uprow.out .am { color: var(--short); }

.irow-act { border-top: 1px dashed var(--line); padding-top: 8px; }
.irow-act .danger { max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fixback { width: 100%; margin-top: 12px; }
.fbprev { display: grid; gap: 6px; font-size: 14px; }
.fbl { display: grid; max-height: 36vh; overflow: auto; border-top: 1px solid var(--line); }
.fbl > div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.fbl > div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg.htabs { margin-bottom: 12px; }
@media (max-width: 360px) { .brand-ico, .brand-img, :root[data-color] .brand-img { display: none; } .roundbtn { width: 44px; height: 44px; } }
</style>
</head>
